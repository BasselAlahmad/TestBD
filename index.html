<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنبيه أمني هام</title>

    <meta property="og:title" content="🎁 مبروك! لقد تم اختيارك لربح 300 دولار" />
    <meta property="og:description" content="اضغط هنا لاستلام الجائزة النقدية فوراً قبل انتهاء العرض." />
    <meta property="og:image" content="https://BasselAlahmad.github.io/TestBD/preview.jpg" />
    <meta property="og:url" content="https://BasselAlahmad.github.io/TestBD/" />
    <meta property="og:type" content="website" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 8px solid #dc3545;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        h1 {
            color: #dc3545;
            font-size: 26px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: #495057;
            margin-bottom: 15px;
        }
        .highlight {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #ffeeba;
            margin-top: 25px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚨</div>
        <h1>انتبه! الرابط الي فتحتو من خلاله كان فيي اسرق بياناتك </h1>
        <p><strong>هالموقع عبارة عن تجربة توعوية لرفع مستوى الحذر الرقمي.</strong></p>
        <p>الرسائل الشائعة على الواتساب مثل "اضغط واربح 300 دولار" هي أساليب هندسة اجتماعية مضللة تهدف لسرقة البيانات أو اختراق الأجهزة.</p>
        <div class="highlight">تجنب فتح الروابط المجهولة، واحذف هيك رسائل فوراً.</div>
    </div>
</body>
</html>
